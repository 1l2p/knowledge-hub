title: Knowledge Hub
description: Higher Education Research Wiki — Axim Collaborative
baseurl: "/knowledge-hub"
url: "https://1l2p.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Exclude from processing
exclude:
  - wiki-page-template.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

# ── Just the Docs settings ────────────────────────────────────────────
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer
footer_content: "Knowledge Hub &mdash; Axim Collaborative. Built with <a href=\"https://just-the-docs.com\">Just the Docs</a>."

# Callouts (styled blockquotes)
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  highlight:
    color: yellow

# Heading anchors
heading_anchors: true

# Aux links (top-right nav)
aux_links:
  "Axim Collaborative":
    - "https://axim.org"
aux_links_new_tab: true
